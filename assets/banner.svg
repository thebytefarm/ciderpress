<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 430" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace">
  <!-- Background -->
  <rect width="878" height="430" rx="10" ry="10" fill="#1e1e2e" />

  <!-- Title bar -->
  <rect width="878" height="36" rx="10" ry="10" fill="#181825" />
  <rect y="26" width="878" height="10" fill="#181825" />

  <!-- Traffic lights -->
  <circle cx="40" cy="18" r="6" fill="#f38ba8" />
  <circle cx="60" cy="18" r="6" fill="#f9e2af" />
  <circle cx="80" cy="18" r="6" fill="#a6e3a1" />

  <!-- Title bar text -->
  <text font-size="12" x="439" y="22" text-anchor="middle" fill="#6c7086">ciderpress</text>

  <!-- CIDERPRESS ASCII art logo (centered) -->
  <g transform="translate(161, 0)" fill="#991b1b">
    <text font-size="13" y="68" xml:space="preserve"> ██████╗██╗██████╗ ███████╗██████╗ ██████╗ ██████╗ ███████╗███████╗███████╗</text>
    <text font-size="13" y="84" xml:space="preserve">██╔════╝██║██╔══██╗██╔════╝██╔══██╗██╔══██╗██╔══██╗██╔════╝██╔════╝██╔════╝</text>
    <text font-size="13" y="100" xml:space="preserve">██║     ██║██║  ██║█████╗  ██████╔╝██████╔╝██████╔╝█████╗  ███████╗███████╗</text>
    <text font-size="13" y="116" xml:space="preserve">██║     ██║██║  ██║██╔══╝  ██╔══██╗██╔═══╝ ██╔══██╗██╔══╝  ╚════██║╚════██║</text>
    <text font-size="13" y="132" xml:space="preserve">╚██████╗██║██████╔╝███████╗██║  ██║██║     ██║  ██║███████╗███████║███████║</text>
    <text font-size="13" y="148" xml:space="preserve"> ╚═════╝╚═╝╚═════╝ ╚══════╝╚═╝  ╚═╝╚═╝     ╚═╝  ╚═╝╚══════╝╚══════╝╚══════╝</text>
  </g>

  <!-- Tagline -->
  <text font-size="12" x="439" y="172" text-anchor="middle" fill="#6c7086">making "I vibe-coded it and it works on my machine" look professional</text>

  <!-- Separator -->
  <line x1="36" y1="188" x2="842" y2="188" stroke="#313244" stroke-width="1" />

  <!-- Split pane divider -->
  <line x1="439" y1="188" x2="439" y2="424" stroke="#313244" stroke-width="1" />

  <!-- ================================================ -->
  <!-- LEFT PANE: terminal                              -->
  <!-- ================================================ -->
  <rect x="24" y="192" width="80" height="24" rx="4" ry="4" fill="#181825" />
  <text font-size="11" x="38" y="208" fill="#cdd6f4">terminal</text>

  <text font-size="12" x="38" y="236"><tspan fill="#89b4fa">~</tspan><tspan fill="#6c7086"> $ </tspan><tspan fill="#cdd6f4">ciderpress dev</tspan></text>

  <!-- Starting -->
  <text font-size="12" x="38" y="264"><tspan fill="#6c7086">Starting </tspan><tspan fill="#991b1b">ciderpress</tspan><tspan fill="#6c7086">...</tspan></text>

  <!-- Output -->
  <text font-size="12" x="38" y="288" xml:space="preserve"><tspan fill="#a6e3a1">  ✓</tspan><tspan fill="#cdd6f4"> Loaded config</tspan></text>
  <text font-size="12" x="38" y="304" xml:space="preserve"><tspan fill="#a6e3a1">  ✓</tspan><tspan fill="#cdd6f4"> Synced 12 documents</tspan></text>
  <text font-size="12" x="38" y="320" xml:space="preserve"><tspan fill="#a6e3a1">  ✓</tspan><tspan fill="#cdd6f4"> Generated sidebar</tspan></text>
  <text font-size="12" x="38" y="336" xml:space="preserve"><tspan fill="#a6e3a1">  ✓</tspan><tspan fill="#cdd6f4"> Watching for changes</tspan></text>

  <!-- Summary -->
  <text font-size="12" x="38" y="364"><tspan fill="#6c7086">Ready — dev server on :5173</tspan></text>

  <!-- New prompt with cursor -->
  <text font-size="12" x="38" y="396"><tspan fill="#89b4fa">~</tspan><tspan fill="#6c7086"> $ </tspan><tspan fill="#cdd6f4">&#x2588;</tspan></text>

  <!-- ================================================ -->
  <!-- RIGHT PANE: config definition                    -->
  <!-- ================================================ -->
  <rect x="443" y="192" width="100" height="24" rx="4" ry="4" fill="#181825" />
  <text font-size="11" x="457" y="208" fill="#cdd6f4">config.ts</text>

  <line x1="477" y1="220" x2="477" y2="424" stroke="#313244" stroke-width="1" />

  <!-- Line numbers -->
  <g font-size="11" fill="#45475a" text-anchor="end">
    <text x="469" y="236">1</text>
    <text x="469" y="252">2</text>
    <text x="469" y="268">3</text>
    <text x="469" y="284">4</text>
    <text x="469" y="300">5</text>
    <text x="469" y="316">6</text>
    <text x="469" y="332">7</text>
    <text x="469" y="348">8</text>
    <text x="469" y="364">9</text>
    <text x="469" y="380">10</text>
    <text x="469" y="396">11</text>
    <text x="469" y="412">12</text>
  </g>

  <!-- Line 1: import { defineConfig } from 'ciderpress' -->
  <text font-size="12" x="487" y="236"><tspan fill="#cba6f7">import</tspan><tspan fill="#9399b2"> { </tspan><tspan fill="#89b4fa">defineConfig</tspan><tspan fill="#9399b2"> } </tspan><tspan fill="#cba6f7">from</tspan><tspan fill="#a6e3a1"> 'ciderpress'</tspan></text>

  <!-- Line 3: export default defineConfig({ -->
  <text font-size="12" x="487" y="268"><tspan fill="#cba6f7">export default </tspan><tspan fill="#89b4fa">defineConfig</tspan><tspan fill="#9399b2">({</tspan></text>

  <!-- Line 4:   title: 'My Docs', -->
  <text font-size="12" x="487" y="284" xml:space="preserve"><tspan fill="#9399b2">  </tspan><tspan fill="#94e2d5">title</tspan><tspan fill="#9399b2">: </tspan><tspan fill="#a6e3a1">'My Docs'</tspan><tspan fill="#9399b2">,</tspan></text>

  <!-- Line 5:   description: 'Project docs', -->
  <text font-size="12" x="487" y="300" xml:space="preserve"><tspan fill="#9399b2">  </tspan><tspan fill="#94e2d5">description</tspan><tspan fill="#9399b2">: </tspan><tspan fill="#a6e3a1">'Project docs'</tspan><tspan fill="#9399b2">,</tspan></text>

  <!-- Line 6:   sidebar: { -->
  <text font-size="12" x="487" y="316" xml:space="preserve"><tspan fill="#9399b2">  </tspan><tspan fill="#94e2d5">sidebar</tspan><tspan fill="#9399b2">: {</tspan></text>

  <!-- Line 7:     guide: { -->
  <text font-size="12" x="487" y="332" xml:space="preserve"><tspan fill="#9399b2">    </tspan><tspan fill="#94e2d5">guide</tspan><tspan fill="#9399b2">: {</tspan></text>

  <!-- Line 8:       label: 'Guide', -->
  <text font-size="12" x="487" y="348" xml:space="preserve"><tspan fill="#9399b2">      </tspan><tspan fill="#94e2d5">label</tspan><tspan fill="#9399b2">: </tspan><tspan fill="#a6e3a1">'Guide'</tspan><tspan fill="#9399b2">,</tspan></text>

  <!-- Line 9:       items: ['intro', 'setup'], -->
  <text font-size="12" x="487" y="364" xml:space="preserve"><tspan fill="#9399b2">      </tspan><tspan fill="#94e2d5">items</tspan><tspan fill="#9399b2">: [</tspan><tspan fill="#a6e3a1">'intro'</tspan><tspan fill="#9399b2">, </tspan><tspan fill="#a6e3a1">'setup'</tspan><tspan fill="#9399b2">],</tspan></text>

  <!-- Line 10:     }, -->
  <text font-size="12" x="487" y="380" xml:space="preserve"><tspan fill="#9399b2">    },</tspan></text>

  <!-- Line 11:   }, -->
  <text font-size="12" x="487" y="396" xml:space="preserve"><tspan fill="#9399b2">  },</tspan></text>

  <!-- Line 12: }) -->
  <text font-size="12" x="487" y="412"><tspan fill="#9399b2">})</tspan></text>
</svg>
