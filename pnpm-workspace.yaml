packages:
  - 'packages/*'
  - 'tools/*'
  - 'examples/*'
  - 'extensions/*'
  - 'benchmarks'
  - 'e2e'

# pnpm prompts before recreating node_modules and aborts outright when
# there is no TTY. The example-site builds shell out to pnpm from inside a
# piped child process, so they hit that abort in CI even though the runner
# sets CI=true. Nothing here is ever installed interactively, so skip the
# prompt rather than depending on env detection surviving each spawn.
confirmModulesPurge: false

# Every package with an install script is explicitly reviewed here. The `false`
# entries preserve the policy where esbuild is the only dependency allowed to
# build.
allowBuilds:
  esbuild: true
  '@swc/core': false
  '@vscode/vsce-sign': false
  core-js: false
  keytar: false
  msw: false
  sharp: false

overrides:
  # vite reaches this repo only through vitest and Ladle — Rspress builds on
  # Rspack and pulls no vite at all. @codspeed/vitest-plugin and Ladle's react
  # plugins still cap their vite range at ^7, which left a second vite major in
  # the tree under pnpm. Both are verified working on 8.x (ladle build and
  # the full bench suite pass), so pin one vite for the whole workspace.
  vite: ^8.2.1

packageExtensions:
  ink-gradient:
    peerDependencies:
      react: '*'

patchedDependencies:
  # Zod 4.5 moved object metadata from `_def` to `def`; accept both until Kidd ships support.
  '@kidd-cli/core@0.24.0': patches/kidd-cli-core-0-24-0.patch

catalog:
  '@rslib/core': ^0.23.2
  '@rspress/core': ^2.0.21
  '@rspress/plugin-sitemap': ^2.0.21
  '@types/react': ^19.2.18
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  massaman: ^0.5.1
  react: ^19.2.8
  react-dom: ^19.2.8
  type-fest: ^5.9.0
  typescript: ^7.0.2
  vitest: ^4.1.11
  zod: ^4.5.4
