packages:
  - 'packages/*'
  - 'tools/*'
  - 'examples/*'
  - 'extensions/*'
  - 'benchmarks'
  - 'e2e'

# pnpm 11 prompts before recreating node_modules and aborts outright when
# there is no TTY. The example-site builds shell out to pnpm from inside a
# piped child process, so they hit that abort in CI even though the runner
# sets CI=true. Nothing here is ever installed interactively, so skip the
# prompt rather than depending on env detection surviving each spawn.
confirmModulesPurge: false

# pnpm 11 replaced `onlyBuiltDependencies` with this map, and `strictDepBuilds`
# now defaults to true — so every package with an install script must be
# explicitly reviewed here or the install errors. The `false` entries preserve
# the pnpm 10 behaviour, where esbuild was the only dependency allowed to build.
allowBuilds:
  esbuild: true
  '@swc/core': false
  '@vscode/vsce-sign': false
  core-js: false
  keytar: false
  msw: false
  sharp: false

overrides:
  # vite reaches this repo only through vitest and Ladle — Rspress builds on
  # Rspack and pulls no vite at all. @codspeed/vitest-plugin and Ladle's react
  # plugins still cap their vite range at ^7, which left a second vite major in
  # the tree under pnpm 11. Both are verified working on 8.x (ladle build and
  # the full bench suite pass), so pin one vite for the whole workspace.
  vite: ^8.2.1

packageExtensions:
  ink-gradient:
    peerDependencies:
      react: '*'

catalog:
  '@rslib/core': ^0.23.2
  '@rspress/core': ^2.0.19
  '@rspress/plugin-sitemap': ^2.0.19
  '@types/react': ^19.2.18
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  es-toolkit: ^1.47.0
  massaman: ^0.5.0
  react: ^19.2.8
  react-dom: ^19.2.8
  ts-pattern: ^5.9.0
  type-fest: ^5.8.0
  typescript: ^7.0.2
  vitest: ^4.1.10
  zod: ^4.4.3
