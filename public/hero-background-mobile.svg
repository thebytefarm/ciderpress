    <path d="M400 706h240M400 754h240M400 802h240" stroke="#fecaca" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <path transform="translate(40 130)" d="M430 530h30v-20h52v20h30v16h30v30h16v92h-16v30h-30v24h-40v-16h-30v16h-40v-24h-30v-30h-16v-92h16v-30h28v-16z" fill="none" stroke="#fb7185" stroke-opacity="0.5" stroke-width="3"/>
  <path transform="translate(40 130)" d="M484 478h22v32h-22z" fill="#78350f"/>
  <path transform="translate(40 130)" d="M504 480h48v14h20v22h-54v-14h-14z" fill="url(#leaf-ink)"/>
  <g>
