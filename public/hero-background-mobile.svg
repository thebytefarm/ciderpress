    <use href="#pixel-apple" transform="translate(435 100) scale(6)" color="#7fa52d" opacity="0.28"/>
    <use href="#pixel-apple" transform="translate(60 310) scale(5)" color="#a93625" opacity="0.2"/>
  </g>
  <rect width="640" height="1080" filter="url(#grain)" opacity="0.72"/>
  <rect x="0.5" y="0.5" width="639" height="1079" fill="none" stroke="#fca5a5" stroke-opacity="0.12"/>
