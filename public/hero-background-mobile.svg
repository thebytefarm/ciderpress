<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" width="640" height="1080">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#080506"/>
      <stop offset="0.52" stop-color="#150607"/>
      <stop offset="1" stop-color="#050303"/>
    </linearGradient>
    <radialGradient id="red-bloom" cx="78%" cy="60%" r="55%">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#7f1d1d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-bloom" cx="6%" cy="82%" r="42%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apple-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="leaf-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#4d7c0f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fecaca" stroke-opacity="0.05"/>
      <circle r="1.5" fill="#fca5a5" fill-opacity="0.16"/>
    </pattern>
    <pattern id="press-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.8" fill="url(#apple-ink)"/>
      <circle cx="12" cy="12" r="1.1" fill="#fb7185" fill-opacity="0.65"/>
    </pattern>
    <pattern id="cider-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#fbbf24" fill-opacity="0.52"/>
      <circle cx="9" cy="9" r="0.8" fill="#ef4444" fill-opacity="0.3"/>
    </pattern>
    <g id="pixel-apple">
      <path fill="currentColor" d="M8 5h4V3h8v2h4v3h4v4h3v12h-3v4h-4v3h-6v-2h-4v2H8v-3H4v-4H1V12h3V8h4z"/>
      <path fill="#fff" fill-opacity="0.2" d="M5 12h4v8H5z"/>
      <path fill="#71340f" d="M14 0h4v5h-4z"/>
      <path fill="#84a82f" d="M18 1h7v2h3v4h-10z"/>
    </g>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="6174"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.13"/></feComponentTransfer>
    </filter>
    <clipPath id="apple">
      <path transform="translate(40 130)" d="M430 530h30v-20h52v20h30v16h30v30h16v92h-16v30h-30v24h-40v-16h-30v16h-40v-24h-30v-30h-16v-92h16v-30h28v-16z"/>
    </clipPath>
  </defs>
  <rect width="640" height="1080" fill="url(#canvas)"/>
  <rect width="640" height="1080" fill="url(#red-bloom)"/>
  <rect width="640" height="1080" fill="url(#amber-bloom)"/>
  <rect width="640" height="1080" fill="url(#grid)"/>
  <g fill="none" stroke="#fca5a5" stroke-opacity="0.12">
    <path d="M0 128h640M0 416h640M0 824h640M160 0v1080M480 0v1080"/>
    <rect x="34" y="54" width="156" height="98" rx="8"/>
