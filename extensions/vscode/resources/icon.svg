<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- Rounded square background (terminal canvas) -->
  <rect width="512" height="512" rx="32" ry="32" fill="#0a0a0a" />

