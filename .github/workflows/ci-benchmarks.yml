name: CI / Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: codspeed-macro
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node must be set up BEFORE pnpm: the codspeed-macro runner ships Node
      # 18. Setting up the repository's Node version first keeps pnpm and every
      # lifecycle script on the same supported runtime.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # `cache: 'pnpm'` on setup-node can't be used here since pnpm isn't on
      # PATH yet, so let action-setup cache the store instead.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: pnpm --filter benchmarks bench:run
