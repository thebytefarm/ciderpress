name: CI / E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref. New commits on a PR cancel the in-flight run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium

      - name: Build packages
        run: pnpm build

      # pnpm install creates `node_modules/.bin/ciderpress` wrappers
      # pointing at `packages/ciderpress/dist/cli.mjs`. That file doesn't
      # exist at install time (built two steps above), so install logs
      # "WARN Failed to create bin at …" and skips the wrapper. Without
      # the wrapper, `pnpm docs:build` fails with `sh: 1: ciderpress: not
      # found`. `--offline` re-runs install against the existing cache to
      # backfill every workspace's .bin links now that the dist exists.
      - name: Refresh bin wrappers
        run: pnpm install --offline

      - name: Build docs site
        run: pnpm docs:build

      - name: Run Playwright tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.playwright/
          retention-days: 7
