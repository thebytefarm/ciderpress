          <path d="M0 0H38" fill="none" stroke-linecap="round" stroke-width="5" />
        </g>
        <g transform="translate(260 220) rotate(-25)">
          <path d="M-5 0C8-18 29-17 42 0 29 17 8 18-5 0Z" fill="#69704a" stroke-width="5" />
          <path d="M0 0H38" fill="none" stroke-linecap="round" stroke-width="5" />
        </g>
      </g>
    </g>

    <g fill="none" stroke="#f0dfbf" stroke-linecap="round" stroke-width="7" opacity="0.88">
      <path d="M183 129c-20-12-8-30 3-42 12-14 14-30-2-43" stroke-dasharray="11 13" />
      <path d="M256 119c-18-17-3-31 5-43 9-14 8-28-5-40" stroke-dasharray="11 13" />
